[project]
name = "venti-music"
version = "0.4.0"
description = "Emotion-aware music intervention, grounded in iso-principle music therapy and Saarikallio's MMR framework."
requires-python = ">=3.10"
dependencies = [
    "spotipy>=2.26,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
vent = "venti_core.cli:main"

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["venti_core"]
